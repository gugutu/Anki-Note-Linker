<style>
    :root {
        --hover-color: rgba(0, 0, 0, 0.1);
        --active-color: rgba(0, 0, 0, 0.2);
    }

    :root.night-mode {
        --hover-color: rgba(255, 255, 255, 0.07);
        --active-color: rgba(0, 0, 0, 0.2);
    }

    body, div, h4 {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    .links {
        overflow-y: auto !important;
        word-break: break-word;
    }

    .links::-webkit-scrollbar {
        width: 12px !important;
    }

    .link-button-text {
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 14px;
        overflow: clip;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-box-orient: vertical;
    }

    .link-button-title {
        font-weight: bold;
        font-size: 14px;
        line-height: 1.15;
        margin-bottom: 1px;
        text-align: center;
        word-break: break-word;
    }

    .katex {
        white-space: normal !important;
        font-size: 16px;
    }

    .katex-display {
        margin: 5px 0;
    }

    .link-button {
        background-color: transparent;
        border-radius: 8px;
        border: 1px solid #ccc;
        cursor: pointer;
        padding: 5px 3px;
        margin: 2px;
    }

    .link-button-invalid {
        background-color: rgba(243, 90, 90, 0.4);
        border-radius: 8px;
        border: 1px solid #ccc;
        cursor: pointer;
        padding: 5px 3px;
        margin: 2px;
    }

    .link-button:hover {
        background-color: var(--hover-color)
    }

    .link-button-invalid:hover {
        background-color: rgba(243, 90, 90, 0.65);
    }

    .link-button:active {
        background-color: var(--active-color)
    }

    .link-button-invalid:active {
        background-color: rgba(243, 90, 90, 0.9);
    }
</style>

<div id="linkTitle"><h4 id="backTitle">Back Links</h4></div>
<div class="links" id="backLinks"></div>
<div><h4 id="forwardTitle">Forward Links</h4></div>
<div class="links" id="forwardLinks"></div>
