name: Build Anki Add-on Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix frontend run test:browser
      - run: uv sync --frozen --group dev
      - run: uv run --frozen --group dev ruff check .
      - run: uv run --frozen --group dev ruff format --check src/addon/anki_note_linker scripts tests
      - run: uv run --frozen --group dev mypy
      - run: uv run --frozen --group dev python -m pytest -q
      - name: Build add-on archive
        run: uv run --frozen python scripts/build_addon.py --version "${GITHUB_REF_NAME}" --output "${GITHUB_REF_NAME}.ankiaddon"
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.ref_name }}.ankiaddon
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: Automated release
          overwrite_files: true
