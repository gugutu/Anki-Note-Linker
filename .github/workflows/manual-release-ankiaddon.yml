name: Publish Manual Anki Add-on Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release and tag name to publish
        required: true
        type: string
      target_commit:
        description: Commit SHA or ref to build from
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix frontend run test:browser
      - run: uv sync --frozen --group dev
      - run: uv run --frozen --group dev ruff check .
      - run: uv run --frozen --group dev ruff format --check src/addon/anki_note_linker scripts tests
      - run: uv run --frozen --group dev mypy
      - run: uv run --frozen --group dev python -m pytest -q
      - name: Build add-on archive
        run: uv run --frozen python scripts/build_addon.py --version "${{ inputs.version_name }}" --output "${{ inputs.version_name }}.ankiaddon"
      - name: Recreate release on demand
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_LABEL: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          target_commit="$(git rev-parse HEAD)"
          if gh release view "$VERSION_LABEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$VERSION_LABEL" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$VERSION_LABEL" "$VERSION_LABEL.ankiaddon" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target_commit" \
            --title "$VERSION_LABEL" \
            --notes "Automated release" \
            --latest=false
